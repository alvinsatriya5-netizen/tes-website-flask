{% extends 'base.html' %}

{% block title %}Edit Barang - Website Flask Saya{% endblock %}

{% block content %}
<h2>Edit Data Barang</h2>

<form action="{{ url_for('edit_barang', id=barang.id) }}" method="POST">
    <div class="form-group">
        <label>Nama Barang</label>
        <input type="text" name="nama" value="{{ barang.nama }}" required>
    </div>
    <div class="form-group">
        <label>Harga (Rp)</label>
        <input type="number" name="harga" value="{{ barang.harga }}" required>
    </div>
    <div class="form-group">
        <label>Stok</label>
        <input type="number" name="stok" value="{{ barang.stok }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Update Barang</button>
    <a href="{{ url_for('data_barang') }}" class="btn btn-secondary">Batal</a>
</form>
{% endblock %}
