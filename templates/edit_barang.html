{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Data Barang</h2>
    <div class="card">
        <div class="card-body">
            <form action="{{ url_for('edit_barang', id=barang.id) }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Nama Barang</label>
                    <input type="text" name="nama" class="form-control" value="{{ barang.nama }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Harga (Rp)</label>
                    <input type="number" name="harga" class="form-control" value="{{ barang.harga }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Stok</label>
                    <input type="number" name="stok" class="form-control" value="{{ barang.stok }}" required>
                </div>
                <button type="submit" class="btn btn-success">Update Barang</button>
                <a href="{{ url_for('data_barang') }}" class="btn btn-secondary">Batal</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
