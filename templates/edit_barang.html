{% extends 'base.html' %}

{% block title %}Edit Barang - Website Flask Saya{% endblock %}

{% block content %}
<h2>Edit Data Barang</h2>

<form action="{{ url_for('edit_barang', id=barang.id) }}" method="POST">
    <div class="form-group">
        <label>Nama Barang</label>
        <input type="text" name="nama" value="{{ barang.nama }}" required>
    </div>
    <div class="form-group">
        <label>Harga (Rp)</label>
        <input type="number" name="harga" min="0" value="{{ barang.harga }}" required>
    </div>
    <div class="form-group">
        <label>Stok</label>
        <!-- Diberikan format '%g' agar desimal seperti 25.4 tampil pas tanpa dibulatkan -->
        <input type="number" step="any" min="0" name="stok" value="{{ '%g' % barang.stok }}" required>
    </div>
    <div class="form-group">
        <label>Satuan</label>
        <select name="satuan" required style="padding: 9px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; outline: none; background: white; width: 100%;">
            {% set opsi_satuan = ['pcs', 'buah', 'lembar', 'rim', 'lusin', 'botol', 'kg', 'gram', 'liter', 'ml', 'pack', 'dus', 'unit'] %}
            {% for s in opsi_satuan %}
                <option value="{{ s }}" {% if barang.satuan == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Update Barang</button>
    <a href="{{ url_for('data_barang') }}" class="btn btn-secondary">Batal</a>
</form>
{% endblock %}
