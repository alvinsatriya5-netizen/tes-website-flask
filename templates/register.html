{% extends 'base.html' %}

{% block title %}Daftar Akun Baru - Website Flask{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;">
    <h2 style="text-align: center; margin-bottom: 20px;">Daftar Akun Baru</h2>

    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Username</label>
            <input type="text" name="username" placeholder="Masukkan username" required style="width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box;">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px;">Password</label>
            <input type="password" name="password" placeholder="Masukkan password" required style="width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Daftar</button>
    </form>

    <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #6c757d;">
        Sudah punya akun? <a href="{{ url_for('login') }}" style="color: #007bff; text-decoration: none; font-weight: bold;">Login di sini</a>
    </p>
</div>
{% endblock %}
